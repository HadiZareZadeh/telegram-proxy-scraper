# Copy this file to config.yaml and fill in your values.
# Get api_id / api_hash from https://my.telegram.org/apps

telegram:
  api_id: 12345678      # <- replace with your api_id
  api_hash: "your_api_hash_here"
  session_name: mtproto_scraper  # stored in sessions/
  # Channels / groups you already joined (usernames, invite links, or numeric IDs)
  # Examples: "@proxychannel", "https://t.me/proxychannel", -1001234567890
  sources:
    - "@ShadowProxy66"
    - "@Gp_config"
    - "@meliproxyy"
    - "@Filtereshekan"
    - "@bored_vpn"
    - "@V2RayRootFree"
    - "@v2ray_free_conf"
    - "@daily_configs"
    - "@PyroProxy"
    - "@Forall_Proxy"
    - "@MTP_roto"
    - "@hideproxi2"
    - "@ProxyMTProto_tel"
    - "@Cheetah_MTP"
    - "@NPROXY"
    - "@OnlineVpnConfigs"
    - "@VIProxys"
    - "@v2cnf"
    - "@DailyV2RY"
    - "@xrayfree"
    - "@V2ray_Click"
    - "@V2rayuir"
    - "@v2proxys"
    - "@v2raynetirana"
    - "@ConfigsV2ray"
    - "@FreeV2rays"
    - "@v2ray_configs_pool"
    - "@Hope_Net"
    - "@FreakConfig"
    - "@ConfigV2rayNG"
    - "@ARv2ray"
    - "@LRNoc"
    - "@vlessconfig"
    - "@vmessprotocol"
    - "@v2rayngvpn"
    - "@OutlineVpnFree"
    - "@PrivateVPNs"
    - "@vpnfail_vless"
    - "@v2raycollector"
    - "@freev2raysn"
    - "@VlessConfigFree"
    - "@v2box_free"
    - "@proxy_mtproto_ir"
  messages_per_source: 300

storage:
  database_file: data/catalog.db
  subscription_file: data/subscription.txt

subscription_server:
  # 0.0.0.0 = reachable from other devices on your LAN (phones, tablets, etc.)
  host: 0.0.0.0
  port: 8765
  # lan_ip: 192.168.1.105  # optional: force LAN URL/QR when VPN/TUN is active
  lan_ip: null

xray:
  # null = auto-detect PATH, then xray/xray.exe or xray/xray
  bin: null

v2ray:
  # HTTP URL fetched through each V2Ray proxy (latency = TTFB). Default is an empty 204.
  # Set test_bytes > 0 only if you want to also read that many body bytes.
  test_url: "http://www.gstatic.com/generate_204"
  test_bytes: 0
  test_timeout: 2.5
  # Parallel Xray probe slots (gRPC outbound swap on one probe process)
  ping_concurrency: 64
  tcp_concurrency: 250
  tcp_timeout: 1.25
  # Local SOCKS ports for Ping V2Ray: 45001 .. 45001+concurrency-1 (API at 45520)
  ping_base_port: 45001
  catalog_max: 50000
  # Unused for V2Ray (healthy rows are never demoted just for ranking)
  max_working: 0
  # Fastest, most recently checked working servers exported to subscription.txt (0 = unlimited)
  subscription_limit: 300
  # Expand HTTP subscription URLs and inline Base64 blobs into individual share links
  expand_subscriptions: true
  subscription_fetch_timeout: 15.0
  # Max HTTP sub URLs fetched per Telegram message (inline Base64 is always scanned)
  subscription_max_urls_per_message: 10
  # Download .npv4 / .npv / .npvt attachments and extract embedded V2Ray servers
  parse_napsternet_attachments: true
  # Decrypt NPVT1 / NPVTSUB1 encrypted Napsternet attachments before extraction
  decrypt_npvt_attachments: true

scraper:
  # How often the scraper re-pings MTProto + due V2Ray rows (seconds; 0 = disabled)
  proxy_check_interval: 1200
  # Pause before reconnecting after a dropped Telegram connection (seconds)
  reconnect_delay: 5

mtproto:
  ping_concurrency: 100
  ping_timeout: 8.0
  # Stop probing once this many working proxies are found; keeps fastest by latency (0 = unlimited)
  max_working: 1000

probe:
  # Adaptive probe scheduler (explore / exploit / recover)
  # Skip chronic failures until their backoff window expires.
  respect_backoff: true
  # Preserve known failures so periodic URL imports do not re-add them as unknown.
  prune_after_failures: 0
  prune_min_checks: 5
  prune_stale_days: 0
  max_failed: 20000
  failed_limit: 0
  prune_incompatible_v2ray: true

proxy_pool:
  # Local SOCKS5+HTTP slots. One Xray process; rotate does not restart it.
  start_port: 16001
  socks_start_port: 16001
  http_start_port: 16401
  xray_api_port: 20802
  stats_port: 20802
  count: 300
  standby_outbounds: 600
  reserve_outbounds: 200
  diversity_rotate_sec: 30
  switch_interval_sec: 30
  reuse_after_rotations: 5
  # Keep short while unique healthy inventory is << slot count (else rotation reuses the same ~100 nodes).
  reuse_after_sec: 60
  min_reuse_sec: 30
  rotate_mode: assignment
  rotate_existing_connections: false
  max_latency_ms: 3000
  random: true

hot_set:
  size: 1500
  refresh_sec: 10
  max_latency_ms: 3000
  freshness_sec: 900

gui:
  # light or dark — restyles the whole control panel
  theme: dark
  # When using app.pyw, start these jobs automatically after the control panel opens
  auto_start_scraper: true
  auto_start_subscription_server: true
  auto_start_proxy_pool: true
  auto_start_ping_v2ray: true
  # Proxies tab: how many MTProto links to open/copy by default
  proxy_open_top: 10
  # Vertical split: fraction of window for tabs (rest is log + input)
  main_pane_ratio: 0.73
  restart_backoff_sec: 2.0
  restart_backoff_max_sec: 30.0

url_sources:
  enabled: true
  urls_file: urls.txt
  fetch_interval: 900
  fetch_timeout: 30.0
  concurrency: 8
